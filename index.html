<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>buy what you like</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chelsea+Market&family=Rock+3D&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<h1 class="title rock-3d-regular">
  BUY WHAT YOU LIKE
</h1>

<div class="container-fluid">
  <div class="row">

    <!-- HOME -->
    <div class="col-md-6 product red">

      <h2 class="chelsea-market-regular">home</h2>

      <img id="homeImg"
           class="product-img"
           src="./assets/img/home/bed.png"
           alt="home image"
           onclick="showRandomHomeImage()">

      <p id="homePrice" class="chelsea-market-regular">$564</p>

      <p id="homeCounter" class="counter">
        3 CLICKS LEFT
      </p>

      <button onclick="addToCart(currentHome)">
        ADD
      </button>

    </div>

    <!--FOOD -->
    <div class="col-md-6 product yellow">

      <h2 class="chelsea-market-regular">food</h2>

      <img id="foodImg"
           class="product-img"
           src="./assets/img/food/croissant.png"
           alt="food image"
           onclick="showRandomFoodImage()">

      <p id="foodPrice" class="chelsea-market-regular">$5</p>

      <p id="foodCounter" class="counter">
        3 CLICKS LEFT
      </p>

      <button onclick="addToCart(currentFood)">
        ADD
      </button>

    </div>

    <!-- HOBBY -->
    <div class="col-md-12 product blue big">

      <h2 class="chelsea-market-regular">hobby</h2>

      <div class="d-flex align-items-center">

        <img id="hobbyImg"
             class="product-img ms-3"
             src="./assets/img/hobby/reading.png"
             alt="hobby image"
             onclick="showRandomHobbyImage()">

      </div>

      <p id="hobbyPrice" class="chelsea-market-regular">
        $89
      </p>

      <p id="hobbyCounter" class="counter">
        3 CLICKS LEFT
      </p>

      <button onclick="addToCart(currentHobby)">
        ADD
      </button>

    </div>

  </div>
</div>

<a href="cart.html" class="cartBtn">CART →</a>

<script src="script.js"></script>
</body>
</html>
