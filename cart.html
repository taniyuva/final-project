<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>Your Cart</h1>

<div id="cartContainer"></div>

<script>

// get cart from storage
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// get container
let container = document.getElementById("cartContainer");

// loop through items
for (let i = 0; i < cart.length; i++) {

  let item = cart[i];

  container.innerHTML +=
    "<div class='cart-item'>" +
    "<h2>" + item.name + "</h2>" +
    "<p>$" + item.price + "</p>" +
    "</div>";

}

</script>

</body>
</html>
