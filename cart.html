<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>Your Cart</h1>

<div id="cartContainer"></div>

<script>

const cart =
  JSON.parse(localStorage.getItem("cart")) || [];

const container =
  document.getElementById("cartContainer");

cart.forEach(item => {

  if (item.name && item.price) {

    container.innerHTML += `
      <div class="cart-item">

        <h2>${item.name}</h2>

        <p>$${item.price}</p>

      </div>
    `;
  }

});

</script>

</body>
</html>
